<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Clinic Admin · Matne Dental</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='7' fill='%230b4f4a'/%3E%3Cpath d='M12 5.2c-1.3 0-2-.6-3.1-.6-1.9 0-3.2 1.5-3.2 3.7 0 1.6.6 2.6.9 4 .4 1.8.5 6.5 2 6.5 1.3 0 1.2-3.6 2-4.6.4-.5.9-.6 1.4-.6s1 .1 1.4.6c.8 1 .7 4.6 2 4.6 1.5 0 1.6-4.7 2-6.5.3-1.4.9-2.4.9-4 0-2.2-1.3-3.7-3.2-3.7-1.1 0-1.8.6-3.1.6z' fill='white'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/admin/admin.css" />
</head>
<body>
  <!-- LOGIN -->
  <section class="login" id="loginView" hidden>
    <form class="login-card" id="loginForm">
      <span class="logo"><svg viewBox="0 0 24 24"><path d="M12 5.2c-1.3 0-2-.6-3.1-.6-1.9 0-3.2 1.5-3.2 3.7 0 1.6.6 2.6.9 4 .4 1.8.5 6.5 2 6.5 1.3 0 1.2-3.6 2-4.6.4-.5.9-.6 1.4-.6s1 .1 1.4.6c.8 1 .7 4.6 2 4.6 1.5 0 1.6-4.7 2-6.5.3-1.4.9-2.4.9-4 0-2.2-1.3-3.7-3.2-3.7-1.1 0-1.8.6-3.1.6z"/></svg></span>
      <h1>Clinic Admin</h1>
      <p class="muted">Matne Advance Dental Clinic &amp; Implant Centre</p>
      <label class="field"><span>Username</span><input name="username" autocomplete="username" required value="admin" /></label>
      <label class="field"><span>Password</span><input name="password" type="password" autocomplete="current-password" required autofocus /></label>
      <p class="error" id="loginError" hidden></p>
      <button class="btn primary block" type="submit">Log in</button>
      <a href="/" class="back">← Back to website</a>
    </form>
  </section>

  <!-- APP -->
  <div class="app" id="appView" hidden>
    <aside class="sidebar">
      <a href="/" class="side-brand" target="_blank" rel="noopener">
        <span class="logo sm"><svg viewBox="0 0 24 24"><path d="M12 5.2c-1.3 0-2-.6-3.1-.6-1.9 0-3.2 1.5-3.2 3.7 0 1.6.6 2.6.9 4 .4 1.8.5 6.5 2 6.5 1.3 0 1.2-3.6 2-4.6.4-.5.9-.6 1.4-.6s1 .1 1.4.6c.8 1 .7 4.6 2 4.6 1.5 0 1.6-4.7 2-6.5.3-1.4.9-2.4.9-4 0-2.2-1.3-3.7-3.2-3.7-1.1 0-1.8.6-3.1.6z"/></svg></span>
        <span><strong>MATNE</strong><small>Clinic Admin</small></span>
      </a>
      <nav class="tabs" id="tabs">
        <button data-tab="appointments" class="active">
          <svg class="i" viewBox="0 0 24 24"><rect x="3" y="4.5" width="18" height="16" rx="3"/><path d="M8 2.5v4M16 2.5v4M3 10h18"/></svg>
          <span>Appointments</span><em class="badge" id="newBadge" hidden></em>
        </button>
        <button data-tab="offers">
          <svg class="i" viewBox="0 0 24 24"><path d="M20.6 13.4l-7.2 7.2a2 2 0 01-2.8 0L3 13V3h10l7.6 7.6a2 2 0 010 2.8z"/><circle cx="7.5" cy="7.5" r="1.5"/></svg>
          <span>Offers &amp; Posters</span>
        </button>
        <button data-tab="gallery">
          <svg class="i" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="8.5" cy="8.5" r="1.8"/><path d="M21 15l-5-5L5 21"/></svg>
          <span>Gallery</span>
        </button>
        <button data-tab="doctors">
          <svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0116 0"/></svg>
          <span>Doctors</span>
        </button>
        <button data-tab="services">
          <svg class="i" viewBox="0 0 24 24"><path d="M12 5.2c-1.3 0-2-.6-3.1-.6-1.9 0-3.2 1.5-3.2 3.7 0 1.6.6 2.6.9 4 .4 1.8.5 6.5 2 6.5 1.3 0 1.2-3.6 2-4.6.4-.5.9-.6 1.4-.6s1 .1 1.4.6c.8 1 .7 4.6 2 4.6 1.5 0 1.6-4.7 2-6.5.3-1.4.9-2.4.9-4 0-2.2-1.3-3.7-3.2-3.7-1.1 0-1.8.6-3.1.6z"/></svg>
          <span>Treatments</span>
        </button>
        <button data-tab="settings">
          <svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 00.3 1.8l.1.1a2 2 0 11-2.8 2.8l-.1-.1a1.7 1.7 0 00-1.8-.3 1.7 1.7 0 00-1 1.5V21a2 2 0 11-4 0v-.1a1.7 1.7 0 00-1.1-1.5 1.7 1.7 0 00-1.8.3l-.1.1a2 2 0 11-2.8-2.8l.1-.1a1.7 1.7 0 00.3-1.8 1.7 1.7 0 00-1.5-1H3a2 2 0 110-4h.1a1.7 1.7 0 001.5-1.1 1.7 1.7 0 00-.3-1.8l-.1-.1a2 2 0 112.8-2.8l.1.1a1.7 1.7 0 001.8.3H9a1.7 1.7 0 001-1.5V3a2 2 0 114 0v.1a1.7 1.7 0 001 1.5 1.7 1.7 0 001.8-.3l.1-.1a2 2 0 112.8 2.8l-.1.1a1.7 1.7 0 00-.3 1.8V9a1.7 1.7 0 001.5 1H21a2 2 0 110 4h-.1a1.7 1.7 0 00-1.5 1z"/></svg>
          <span>Clinic &amp; WhatsApp</span>
        </button>
        <button data-tab="account">
          <svg class="i" viewBox="0 0 24 24"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 018 0v4"/></svg>
          <span>Account</span>
        </button>
      </nav>
      <div class="side-foot">
        <a href="/" target="_blank" rel="noopener" class="btn ghost sm block">View website ↗</a>
        <button class="btn ghost sm block" id="logoutBtn">Log out</button>
      </div>
    </aside>

    <main class="content">
      <div class="warn" id="defaultPwWarn" hidden>
        You are still using the default password. <button class="link" data-goto="account">Change it now →</button>
      </div>
      <div id="panel"></div>
    </main>
  </div>

  <div class="toasts" id="toasts" aria-live="polite"></div>

  <script src="/admin/admin.js" defer></script>
</body>
</html>
